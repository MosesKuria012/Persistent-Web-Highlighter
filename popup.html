<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Persistent Web Highlighter</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div id="app">
    <header>
      <div class="header-left">
        <svg class="logo-icon" width="16" height="16" viewBox="0 0 24 24" fill="none">
          <path d="M3 5h12M3 8h9M3 11h12M3 14h7" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M15 10l4 4-2 6-5-3 3-7z" fill="#fbbf24"/>
        </svg>
        <span class="header-title">Persistent Web Highlighter</span>
      </div>
      <div class="header-actions">
        <span id="highlight-count" class="badge">0</span>
        <button id="toggle-site-btn" class="icon-btn toggle-on" title="Highlighting enabled on this site — click to disable">
          <svg id="toggle-icon-on" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg id="toggle-icon-off" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
        </button>
        <a href="#" id="open-dashboard" class="icon-btn" title="Open dashboard">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        </a>
      </div>
    </header>

    <div id="highlight-list-container">
      <div id="site-blocked-state" class="hidden">
        <div class="blocked-notice">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#3a3a60" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg>
          <p class="blocked-title" id="blocked-title">Highlighting disabled</p>
          <p class="blocked-sub" id="blocked-sub">This site is not supported.</p>
        </div>
      </div>
      <div id="empty-state" class="hidden">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none">
          <path d="M3 5h12M3 8h9M3 11h12M3 14h7" stroke="#2e2e50" stroke-width="2" stroke-linecap="round"/>
          <path d="M15 10l4 4-2 6-5-3 3-7z" fill="#2e2e50"/>
        </svg>
        <p class="empty-title">No highlights on this page</p>
        <p class="empty-sub">Select any text and choose a color.</p>
      </div>
      <ul id="highlight-list"></ul>
    </div>

    <footer>
      <span>Select text → pick a color → saved</span>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
